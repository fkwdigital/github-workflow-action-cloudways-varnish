name: "Cloudways Varnish Service Manager"
description: "Manage Varnish service state (enable/disable/purge) on Cloudways servers"
author: "FKW Digital <hello@fkwdigital.com>"
runs:
  using: "node24"
  main: "dist/index.js"

branding:
  icon: "zap"
  color: "blue"

inputs:
  CLOUDWAYS_API_TOKEN:
    description: "Cloudways API access token (recommended). Replaces CLOUDWAYS_EMAIL + CLOUDWAYS_API_KEY."
    required: false
  CLOUDWAYS_EMAIL:
    description: "(Deprecated) Cloudways account email, used with CLOUDWAYS_API_KEY when no access token is set"
    required: false
  CLOUDWAYS_API_KEY:
    description: "(Deprecated) Cloudways legacy API key. Stops working on October 15, 2026."
    required: false
  CLOUDWAYS_SERVER_ID:
    description: "Cloudways server ID"
    required: true
  ACTION:
    description: "Action to perform: enable, disable, or purge"
    required: true
    default: "purge"
  CLOUDWAYS_API_URL:
    description: "Cloudways API base URL"
    default: "https://api.cloudways.com/api/v1"
